<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>花ちゃんウォーク</title>
    <!-- ドット絵フォント -->
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff7e79;
            --accent: #ffd700;
            --bg-color: #2c3e50;
            --panel-bg: #fff;
            --text-color: #333;
            --font-pixel: 'DotGothic16', sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        body {
            font-family: var(--font-pixel);
            background-color: var(--bg-color);
            margin: 0; padding: 0 0 80px 0;
            color: var(--text-color);
            overflow: hidden; /* アプリっぽく */
        }

        /* --- UI Components --- */
        .container {
            max-width: 600px; margin: 0 auto; height: 100vh;
            display: flex; flex-direction: column;
            background: #f0f8ff;
            position: relative;
        }

        .pixel-panel {
            background: var(--panel-bg);
            border: 4px solid #4a4a4a;
            border-radius: 8px;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
            padding: 15px;
            margin: 10px;
            position: relative;
        }

        .btn {
            font-family: var(--font-pixel);
            background: var(--primary); color: white;
            border: 2px solid #4a4a4a;
            padding: 10px 0; width: 100%;
            font-size: 1.2rem; cursor: pointer;
            box-shadow: 0 4px 0 #c0392b;
            border-radius: 4px;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #c0392b; }

        /* --- Screens --- */
        .screen {
            flex: 1; overflow-y: auto; display: none; padding-bottom: 20px;
            background-image: radial-gradient(#dbeeff 15%, transparent 16%), radial-gradient(#dbeeff 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }
        .screen.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

        /* --- Sprite System --- */
        /* 画像レイアウト (4x4 Grid想定):
           Row1: Hero (Idle, Walk, Attack, X)
           Row2: Gacha Chars (Hero, Mage, Warrior, Villager)
           Row3: Enemies (Slime, Goblin, King, Dragon)
           Row4: Backgrounds (Forest, Town, X, X)
        */
        .sprite-sheet {
            display: none; /* JSでロードした画像をここにセット */
        }

        .sprite {
            display: inline-block;
            background-image: var(--sprite-url, none); /* JSでセット */
            background-size: 400% 400%; /* 4 columns, 4 rows */
            background-repeat: no-repeat;
            image-rendering: pixelated;
            position: relative;
        }
        
        /* プレースホルダー（画像がない時用） */
        .sprite::after {
            content: '?';
            position: absolute; top:0; left:0; width:100%; height:100%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.1); color: #aaa;
            font-size: 2rem;
            z-index: -1;
        }

        /* Sprite Mappings */
        /* Row 1: Hero */
        .sp-hero-idle   { background-position: 0% 0%; }
        .sp-hero-walk   { background-position: 33.3% 0%; animation: bounce 0.5s infinite alternate; }
        .sp-hero-attack { background-position: 66.6% 0%; }
        
        /* Row 2: Allies */
        .sp-ally-hero    { background-position: 0% 33.3%; }
        .sp-ally-mage    { background-position: 33.3% 33.3%; }
        .sp-ally-warrior { background-position: 66.6% 33.3%; }
        .sp-ally-villager{ background-position: 100% 33.3%; }

        /* Row 3: Enemies */
        .sp-en-slime  { background-position: 0% 66.6%; }
        .sp-en-goblin { background-position: 33.3% 66.6%; }
        .sp-en-king   { background-position: 66.6% 66.6%; transform: scale(1.3); }
        .sp-en-dragon { background-position: 100% 66.6%; transform: scale(1.5); }

        /* Row 4: Backgrounds */
        .bg-forest { 
            background-image: var(--sprite-url, none); 
            background-position: 0% 100%; 
            background-size: 200% 400%; /* 横2枚、縦4行として扱う */
        }
        .bg-town { 
            background-image: var(--sprite-url, none); 
            background-position: 100% 100%; 
            background-size: 200% 400%;
        }

        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-5px); } }

        /* --- Home Screen --- */
        .hero-stage {
            height: 250px;
            width: 100%;
            position: relative;
            border-bottom: 4px solid #4a4a4a;
            overflow: hidden;
            background-color: #81c784; /* fallback */
            image-rendering: pixelated;
        }
        .char-main {
            width: 120px; height: 120px;
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%);
        }

        /* --- Battle Screen --- */
        .battle-view {
            height: 250px;
            background: #222;
            position: relative;
            overflow: hidden;
            border-bottom: 4px solid #fff;
        }
        .battler {
            width: 100px; height: 100px;
            position: absolute; bottom: 30px;
        }
        .battler.p { left: 20%; }
        .battler.e { right: 20%; }
        
        /* Damage Text Effect */
        .dmg-popup {
            position: absolute;
            color: white; font-size: 2.5rem; font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
            z-index: 100;
            animation: popUp 0.8s forwards;
        }
        .dmg-crit { color: #ffeb3b; font-size: 3.5rem; }
        
        @keyframes popUp {
            0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
            20% { transform: translate(-50%, -40px) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -80px) scale(1); opacity: 0; }
        }

        .shake-screen { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-4px, 0, 0); }
            20%, 80% { transform: translate3d(8px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-16px, 0, 0); }
            40%, 60% { transform: translate3d(16px, 0, 0); }
        }

        /* --- Gacha Screen --- */
        .gacha-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            display: none;
            justify-content: center; align-items: center; flex-direction: column;
        }
        .stone-gem {
            font-size: 5rem;
            cursor: pointer;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));
            animation: float 2s infinite ease-in-out;
            transition: transform 0.1s;
        }
        .stone-gem:active { transform: scale(0.9); }
        
        @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-20px); } }
        
        .gacha-glow {
            position: absolute; width: 300px; height: 300px;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
        }
        .glow-blue { box-shadow: 0 0 50px 20px #3498db; background: rgba(52, 152, 219, 0.3); }
        .glow-gold { box-shadow: 0 0 80px 30px #f1c40f; background: rgba(241, 196, 15, 0.3); }
        .glow-rainbow {
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,0,0,0.2) 20%, rgba(0,255,0,0.2) 40%, rgba(0,0,255,0.2) 60%, transparent 80%);
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .char-reveal {
            transform: scale(0); opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center; color: white;
        }
        .char-reveal.show { transform: scale(1); opacity: 1; }

        /* --- Navigation --- */
        .nav-bar {
            position: absolute; bottom: 0; width: 100%; height: 70px;
            background: #fff; border-top: 4px solid #4a4a4a;
            display: flex; justify-content: space-around; align-items: center;
            z-index: 1000;
        }
        .nav-item {
            text-align: center; color: #999; font-size: 0.7rem; cursor: pointer;
            width: 20%;
        }
        .nav-item.active { color: var(--primary); font-weight: bold; transform: translateY(-2px); }
        .nav-icon { font-size: 1.5rem; display: block; margin-bottom: 2px; }

    </style>
</head>
<body>

<div class="container" id="app-container">

    <!-- HOME -->
    <div id="screen-home" class="screen active">
        <!-- Stage / Char View -->
        <div id="home-bg" class="hero-stage bg-forest">
            <div style="position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.6); color:white; padding:5px 10px; border-radius:15px; font-size:0.9rem;">
                Lv.<span id="disp-lvl">1</span> <span id="disp-name">花ちゃん</span>
            </div>
            <div id="home-char" class="sprite char-main sp-hero-walk"></div>
        </div>

        <div class="pixel-panel" style="text-align:center;">
            <div style="font-size:0.9rem; color:#888;">今日の歩数</div>
            <div style="font-size:3rem; color:#e74c3c; line-height:1;"><span id="disp-steps">0</span></div>
            <div style="font-size:0.8rem; margin-top:5px;">
                次のレベルまで: <strong id="disp-next">100</strong>歩
            </div>
            
            <div style="display:flex; gap:10px; margin-top:15px;">
                <input type="number" id="inp-steps" placeholder="歩数入力" style="flex:1; padding:10px; border:2px solid #ccc; font-family:inherit;">
                <button class="btn" style="width:auto; background:#2ecc71;" onclick="addSteps()">登録</button>
            </div>
        </div>

        <div class="pixel-panel">
            <h3 style="margin:0 0 10px 0; border-bottom:2px dashed #ccc;">ステータス</h3>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; font-size:1.1rem;">
                <div>HP: <strong id="st-hp">100</strong></div>
                <div>MP: <strong id="st-mp">10</strong></div>
                <div>攻: <strong id="st-atk">10</strong></div>
                <div>防: <strong id="st-def">10</strong></div>
            </div>
        </div>
        
        <div style="padding:0 10px;">
            <button class="btn" style="background:#3498db;" onclick="openCharSelect()">キャラ変更</button>
        </div>
    </div>

    <!-- BATTLE -->
    <div id="screen-battle" class="screen">
        <div class="pixel-panel">
            <h2>⚔️ クエスト</h2>
            <div id="stage-list"></div>
        </div>
        
        <!-- Battle Scene (Overlay) -->
        <div id="battle-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#222; z-index:1500; overflow-y:auto;">
            <div class="battle-view" id="battle-stage">
                <div id="btl-p" class="sprite battler p sp-hero-idle"></div>
                <div id="btl-e" class="sprite battler e sp-en-slime"></div>
            </div>
            
            <div style="padding:15px; color:#fff;">
                <div id="battle-log" style="height:150px; overflow-y:auto; font-family:monospace; border:2px solid #666; padding:10px; background:rgba(0,0,0,0.5); font-size:0.9rem;"></div>
                <button class="btn" style="margin-top:20px; background:#95a5a6;" onclick="closeBattle()">逃げる / 戻る</button>
            </div>
        </div>
    </div>

    <!-- GACHA -->
    <div id="screen-gacha" class="screen">
        <div class="pixel-panel" style="text-align:center; background:#fff0f5;">
            <h2 style="color:#e91e63;">💎 召喚</h2>
            <div style="font-size:1.5rem; margin-bottom:15px;">
                石: <strong id="stone-cnt" style="color:#3498db;">0</strong>
            </div>
            <button class="btn" onclick="startGacha()">5個で召喚！</button>
        </div>

        <div class="pixel-panel">
            <h3>仲間リスト</h3>
            <div id="char-list"></div>
        </div>
    </div>

    <!-- HISTORY -->
    <div id="screen-history" class="screen">
        <div class="pixel-panel">
            <h2>📜 記録</h2>
            <p>累計歩数: <strong id="hist-total">0</strong></p>
            <p>クリア済: <strong id="hist-stage">0</strong></p>
        </div>
    </div>

</div>

<!-- NAV BAR -->
<div class="nav-bar">
    <div class="nav-item active" onclick="nav('home',this)"><span class="nav-icon">🏠</span>ホーム</div>
    <div class="nav-item" onclick="nav('battle',this)"><span class="nav-icon">⚔️</span>バトル</div>
    <div class="nav-item" onclick="nav('gacha',this)"><span class="nav-icon">💎</span>ガチャ</div>
    <div class="nav-item" onclick="document.getElementById('file-input').click()"><span class="nav-icon">⚙️</span>画像</div>
</div>

<!-- Hidden File Input -->
<input type="file" id="file-input" accept="image/*" style="display:none;" onchange="loadSprite(this)">

<!-- Gacha Animation Overlay -->
<div id="gacha-ui" class="gacha-overlay">
    <div id="gacha-glow" class="gacha-glow"></div>
    <div id="gacha-stone" class="stone-gem" onclick="openStone()">💎</div>
    <div style="color:white; margin-top:20px; animation:blink 1s infinite;">TAP THE GEM!</div>
    
    <div id="gacha-reveal" class="char-reveal">
        <div id="new-char-img" class="sprite" style="width:120px; height:120px; border:4px solid white; border-radius:10px; background-color:#fff;"></div>
        <h2 id="new-char-name" style="margin:10px 0; font-size:2rem; text-shadow:0 0 10px gold;">???</h2>
        <div id="new-char-rare" style="font-size:1.5rem;">SSR</div>
        <button class="btn" style="margin-top:20px; width:200px;" onclick="closeGacha()">OK</button>
    </div>
</div>

<!-- Char Select Modal -->
<div id="char-modal" class="gacha-overlay" style="justify-content:flex-start; padding-top:50px;">
    <div class="pixel-panel" style="width:90%; max-height:80%; overflow-y:auto;">
        <h3>キャラクター変更</h3>
        <div id="select-list"></div>
        <button class="btn" style="margin-top:20px; background:#7f8c8d;" onclick="document.getElementById('char-modal').style.display='none'">閉じる</button>
    </div>
</div>

<script>
    // --- Data Definition ---
    const CHARS = {
        hana: { name: "花ちゃん", rarity: "N", skinBase: "sp-hero", stats: {hp:100, atk:10, def:10} },
        hero: { name: "伝説の勇者", rarity: "SSR", skinBase: "sp-ally-hero", stats: {hp:150, atk:25, def:15} },
        mage: { name: "魔導師", rarity: "SR", skinBase: "sp-ally-mage", stats: {hp:90, atk:35, def:8} },
        warrior: { name: "重戦士", rarity: "R", skinBase: "sp-ally-warrior", stats: {hp:130, atk:15, def:20} },
        villager: { name: "村人A", rarity: "N", skinBase: "sp-ally-villager", stats: {hp:80, atk:8, def:8} }
    };

    const ENEMIES = [
        { name: "スライム", skin: "sp-en-slime", hp:40, atk:5 },
        { name: "ゴブリン", skin: "sp-en-goblin", hp:80, atk:12 },
        { name: "キング", skin: "sp-en-king", hp:400, atk:30 },
        { name: "ドラゴン", skin: "sp-en-dragon", hp:3000, atk:150 }
    ];

    // --- State ---
    let state = {
        total: 0,
        stones: 5,
        cleared: 0,
        roster: [{ id: Date.now(), type: 'hana', lv: 1, exp: 0 }],
        activeId: null // set in init
    };

    // --- Init & Save ---
    function init() {
        const saved = localStorage.getItem('hw_v5');
        if(saved) state = JSON.parse(saved);
        if(!state.activeId && state.roster.length>0) state.activeId = state.roster[0].id;
        
        // Load Sprite if cached (簡易実装: 画像は毎回設定推奨だが、ブラウザキャッシュに頼る)
        // 今回はユーザーに毎回設定させるか、LocalStorageにBase64保存は重いので、
        // 起動時に「画像をロードしてね」と促す運用にする
        
        updateUI();
    }
    
    function save() {
        localStorage.setItem('hw_v5', JSON.stringify(state));
        updateUI();
    }

    // --- Logic ---
    function getActiveChar() {
        return state.roster.find(c => c.id === state.activeId) || state.roster[0];
    }

    function getStats(charData) {
        const tmpl = CHARS[charData.type];
        // Lv10以降は 1.01^(lv-10) 倍率
        let mult = Math.pow(1.1, Math.min(9, charData.lv - 1));
        if(charData.lv > 10) mult *= Math.pow(1.01, charData.lv - 10);
        
        return {
            hp: Math.floor(tmpl.stats.hp * mult),
            atk: Math.floor(tmpl.stats.atk * mult),
            def: Math.floor(tmpl.stats.def * mult)
        };
    }

    function getNextExp(lv) {
        if(lv < 10) return lv * 100;
        return Math.floor(1000 * Math.pow(1.01, lv - 10));
    }

    function addSteps() {
        const v = parseInt(document.getElementById('inp-steps').value);
        if(!v || v<=0) return;
        document.getElementById('inp-steps').value = "";
        
        state.total += v;
        const char = getActiveChar();
        char.exp += v;
        
        // Level Up Logic
        while(true) {
            const req = getNextExp(char.lv);
            if(char.exp >= req) {
                char.exp -= req;
                char.lv++;
                alert(`レベルアップ！ Lv.${char.lv} になりました！`);
            } else break;
        }
        save();
    }

    // --- UI Update ---
    function updateUI() {
        const char = getActiveChar();
        const tmpl = CHARS[char.type];
        const stats = getStats(char);
        const req = getNextExp(char.lv);

        // Home
        document.getElementById('disp-lvl').innerText = char.lv;
        document.getElementById('disp-name').innerText = tmpl.name;
        document.getElementById('disp-steps').innerText = state.total; // 本日の歩数ロジックは省略し累計表示とします
        document.getElementById('disp-next').innerText = req - char.exp;
        
        document.getElementById('st-hp').innerText = stats.hp;
        document.getElementById('st-mp').innerText = Math.floor(stats.hp/10);
        document.getElementById('st-atk').innerText = stats.atk;
        document.getElementById('st-def').innerText = stats.def;
        
        // Sprite
        const sp = document.getElementById('home-char');
        sp.className = `sprite char-main ${tmpl.skinBase}-walk`; // 動かす
        
        // Background
        const bg = document.getElementById('home-bg');
        bg.className = (state.cleared >= 5) ? 'hero-stage bg-town' : 'hero-stage bg-forest';

        // Gacha/History
        document.getElementById('stone-cnt').innerText = state.stones;
        document.getElementById('hist-total').innerText = state.total;
        document.getElementById('hist-stage').innerText = state.cleared;

        renderStageList();
        renderCharList();
    }

    // --- Image Loader ---
    function loadSprite(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function (e) {
                document.documentElement.style.setProperty('--sprite-url', `url(${e.target.result})`);
                alert("画像を適用しました！");
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    // --- Battle System ---
    function renderStageList() {
        const list = document.getElementById('stage-list');
        list.innerHTML = "";
        for(let i=1; i<=state.cleared+1; i++) {
            const eTmpl = ENEMIES[(i-1)%4];
            const div = document.createElement('div');
            div.className = "pixel-panel";
            div.style.padding = "10px";
            div.style.cursor = "pointer";
            div.innerHTML = `<strong>Stage ${i}</strong> (Boss: ${eTmpl.name})`;
            div.onclick = () => startBattle(i);
            list.appendChild(div);
        }
    }

    function startBattle(stg) {
        document.getElementById('battle-overlay').style.display = 'block';
        const log = document.getElementById('battle-log');
        log.innerHTML = `--- Stage ${stg} Start ---<br>`;
        
        const char = getActiveChar();
        const cStats = getStats(char);
        const cTmpl = CHARS[char.type];
        
        const eTmpl = ENEMIES[(stg-1)%4];
        const grow = Math.pow(1.15, stg-1);
        let enemy = { 
            hp: Math.floor(eTmpl.hp * grow), 
            atk: Math.floor(eTmpl.atk * grow),
            max: Math.floor(eTmpl.hp * grow)
        };

        // Setup View
        document.getElementById('btl-p').className = `sprite battler p ${cTmpl.skinBase}-idle`;
        document.getElementById('btl-e').className = `sprite battler e ${eTmpl.skin}`;
        
        let turn = 0;
        let pHp = cStats.hp;
        
        // Battle Loop
        window.btlTimer = setInterval(() => {
            turn++;
            
            // Player Attack
            const dmg = Math.max(1, Math.floor(cStats.atk * (0.9 + Math.random()*0.2)));
            enemy.hp -= dmg;
            
            // Anim
            const pEl = document.getElementById('btl-p');
            pEl.className = `sprite battler p ${cTmpl.skinBase}-attack`;
            setTimeout(()=> pEl.className = `sprite battler p ${cTmpl.skinBase}-idle`, 300);
            showDmg(document.getElementById('btl-e'), dmg, false);
            
            log.innerHTML = `<span style="color:#4caf50">あなた: ${dmg}ダメ</span> (敵残:${Math.max(0,enemy.hp)})<br>` + log.innerHTML;
            
            if(enemy.hp <= 0) {
                clearInterval(window.btlTimer);
                win(stg);
                return;
            }

            // Enemy Turn
            setTimeout(() => {
                const eDmg = Math.max(1, Math.floor(enemy.atk - cStats.def/2));
                pHp -= eDmg;
                
                showDmg(document.getElementById('btl-p'), eDmg, true);
                document.getElementById('app-container').classList.add('shake-screen');
                setTimeout(()=>document.getElementById('app-container').classList.remove('shake-screen'), 400);

                log.innerHTML = `<span style="color:#e74c3c">敵: ${eDmg}ダメ</span> (残HP:${Math.max(0,pHp)})<br>` + log.innerHTML;
                
                if(pHp <= 0) {
                    clearInterval(window.btlTimer);
                    log.innerHTML = `<strong style="color:red">敗北...</strong><br>` + log.innerHTML;
                }
            }, 600);
        }, 1500);
    }

    function showDmg(target, val, isCrit) {
        const rect = target.getBoundingClientRect();
        const el = document.createElement('div');
        el.className = isCrit ? 'dmg-popup dmg-crit' : 'dmg-popup';
        el.innerText = val;
        el.style.left = (rect.left + 20) + "px";
        el.style.top = rect.top + "px";
        document.body.appendChild(el);
        setTimeout(()=>el.remove(), 800);
    }

    function win(stg) {
        const log = document.getElementById('battle-log');
        const getStones = Math.floor(Math.random()*3)+1;
        log.innerHTML = `<strong style="color:gold">勝利！ 石+${getStones}</strong><br>` + log.innerHTML;
        
        if(stg > state.cleared) state.cleared = stg;
        state.stones += getStones;
        save();
    }

    function closeBattle() {
        clearInterval(window.btlTimer);
        document.getElementById('battle-overlay').style.display = 'none';
        updateUI();
    }

    // --- Gacha Logic ---
    let pendingGachaResult = null;

    function startGacha() {
        if(state.stones < 5) { alert("石が足りません"); return; }
        state.stones -= 5;
        save();
        
        // UI Reset
        document.getElementById('gacha-ui').style.display = 'flex';
        document.getElementById('gacha-stone').style.display = 'block';
        document.getElementById('gacha-reveal').classList.remove('show');
        document.getElementById('gacha-glow').className = 'gacha-glow'; // reset
        
        // Decide Result
        const r = Math.random()*100;
        let type = 'villager';
        if(r < 8) type = 'hero';
        else if(r < 20) type = 'mage';
        else if(r < 40) type = 'warrior';
        
        pendingGachaResult = type;
    }

    function openStone() {
        const type = pendingGachaResult;
        const rarity = CHARS[type].rarity;
        
        // Glow Effect
        const glow = document.getElementById('gacha-glow');
        glow.style.opacity = 1;
        if(rarity === 'SSR') glow.classList.add('glow-rainbow');
        else if(rarity === 'SR') glow.classList.add('glow-gold');
        else glow.classList.add('glow-blue');
        
        // Shake Stone
        const stone = document.getElementById('gacha-stone');
        stone.style.animation = "shake 0.5s infinite";

        // Reveal Delay
        setTimeout(() => {
            stone.style.display = 'none';
            showResult(type);
        }, 1500);
    }

    function showResult(type) {
        const tmpl = CHARS[type];
        const rev = document.getElementById('gacha-reveal');
        
        document.getElementById('new-char-name').innerText = tmpl.name;
        document.getElementById('new-char-rare').innerText = tmpl.rarity;
        document.getElementById('new-char-rare').style.color = (tmpl.rarity==='SSR' ? 'gold' : 'white');
        
        const img = document.getElementById('new-char-img');
        img.className = `sprite ${tmpl.skinBase}-walk`; // show walking char
        
        rev.classList.add('show');
        
        // Add to roster
        state.roster.push({ id: Date.now(), type: type, lv: 1, exp: 0 });
        save();
    }

    function closeGacha() {
        document.getElementById('gacha-ui').style.display = 'none';
        updateUI();
    }

    function renderCharList() {
        const div = document.getElementById('char-list');
        div.innerHTML = "";
        state.roster.slice().reverse().forEach(c => {
            const tmpl = CHARS[c.type];
            const d = document.createElement('div');
            d.style.borderBottom = "1px solid #ddd"; d.style.padding="5px";
            d.innerHTML = `[${tmpl.rarity}] ${tmpl.name} (Lv.${c.lv})`;
            div.appendChild(d);
        });
    }

    // --- Char Select ---
    function openCharSelect() {
        document.getElementById('char-modal').style.display = 'flex';
        const div = document.getElementById('select-list');
        div.innerHTML = "";
        state.roster.forEach(c => {
            const tmpl = CHARS[c.type];
            const btn = document.createElement('div');
            btn.className = "btn";
            btn.style.marginTop = "10px";
            btn.style.background = (c.id === state.activeId) ? "#2ecc71" : "#fff";
            btn.style.color = (c.id === state.activeId) ? "#fff" : "#333";
            btn.innerHTML = `${tmpl.name} (Lv.${c.lv})`;
            btn.onclick = () => {
                state.activeId = c.id;
                save();
                document.getElementById('char-modal').style.display = 'none';
            };
            div.appendChild(btn);
        });
    }

    // --- Nav ---
    function nav(id, el) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-'+id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
    }

    init();
</script>
</body>
</html>
