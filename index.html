<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>花ちゃんウォーク</title>
    
    <!-- Google Fonts: Pixel Style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #ff7e79;
            --secondary: #5bc0de;
            --bg-color: #fce4ec;
            --panel-bg: #fff;
            --text-color: #2c3e50;
            --border-color: #4a4a4a;
            --font-pixel: 'DotGothic16', sans-serif;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-pixel);
            background-color: #8fb3e6; /* Map water color */
            background-image: 
                linear-gradient(rgba(255,255,255,0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.2) 1px, transparent 1px);
            background-size: 20px 20px; /* Grid Map Effect */
            margin: 0;
            padding: 0 0 90px 0;
            color: var(--text-color);
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 10px;
        }
        
        /* Pixel Art UI Borders */
        .pixel-box {
            background: var(--panel-bg);
            border: 4px solid var(--border-color);
            border-radius: 4px; /* Slightly rounded for modern feel */
            box-shadow: 4px 4px 0px rgba(0,0,0,0.2);
            margin-bottom: 15px;
            padding: 15px;
            position: relative;
        }

        .btn-pixel {
            font-family: var(--font-pixel);
            background: var(--primary);
            color: white;
            border: 2px solid var(--border-color);
            padding: 10px 20px;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.3);
            transition: transform 0.1s, box-shadow 0.1s;
            text-shadow: 1px 1px 0 #000;
        }
        .btn-pixel:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px rgba(0,0,0,0.3);
        }

        /* --- Sprite System --- */
        /* Generated Image URL */
        :root {
            --sprite-url: url('http://googleusercontent.com/image_generation_content/0');
        }

        .sprite-container {
            width: 128px;
            height: 128px;
            display: inline-block;
            position: relative;
            image-rendering: pixelated;
        }

        .sprite {
            width: 100%;
            height: 100%;
            background-image: var(--sprite-url);
            background-repeat: no-repeat;
            background-size: 200% 200%; /* Adjust based on generated image layout */
            /* Assuming 2 rows, 3-4 columns logic. 
               We will use specific classes to crop. 
               Since AI image layout varies, we use approximate percentages. */
        }

        /* Hero Sprites (Top Row) */
        .hero-idle { background-position: 0% 0%; }
        .hero-walk { background-position: 50% 0%; animation: bobbing 0.5s infinite steps(2); }
        .hero-attack { background-position: 100% 0%; }

        /* Enemy Sprites (Bottom Row) */
        .enemy-slime { background-position: 0% 100%; }
        .enemy-goblin { background-position: 33% 100%; }
        .enemy-king { background-position: 66% 100%; transform: scale(1.2); }
        .enemy-dragon { background-position: 100% 100%; transform: scale(1.5); }

        @keyframes bobbing { 0% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

        /* --- Header --- */
        .header {
            text-align: center;
            background: #fffbe6;
        }
        .step-count {
            font-size: 3rem;
            color: #d32f2f;
            text-shadow: 2px 2px 0px #ffcdd2;
            line-height: 1;
        }
        .level-tag {
            background: var(--secondary);
            color: white;
            padding: 2px 8px;
            border: 2px solid var(--border-color);
            font-size: 0.9rem;
            position: absolute;
            top: -10px;
            right: 10px;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
        }

        /* --- Battle Screen --- */
        .battle-stage {
            height: 250px;
            background: #a5d6a7; /* Grass */
            background-image: 
                repeating-linear-gradient(#81c784 0 2px, transparent 2px 100%),
                repeating-linear-gradient(90deg, #81c784 0 2px, transparent 2px 100%);
            background-size: 40px 40px;
            border: 4px solid var(--border-color);
            position: relative;
            display: flex;
            justify-content: space-around;
            align-items: center;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        /* Battle Effects */
        .damage-popup {
            position: absolute;
            color: #fff;
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
            pointer-events: none;
            animation: popUp 0.8s forwards;
            z-index: 100;
        }
        .damage-player { color: #ffeb3b; }
        .damage-enemy { color: #fff; }

        @keyframes popUp {
            0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
            20% { transform: translate(-50%, -30px) scale(1.5); opacity: 1; }
            100% { transform: translate(-50%, -60px) scale(1); opacity: 0; }
        }

        .shake { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }

        .attack-anim-right { animation: lungeRight 0.3s forwards; }
        .attack-anim-left { animation: lungeLeft 0.3s forwards; }
        
        @keyframes lungeRight { 0% { transform: translateX(0); } 50% { transform: translateX(30px); } 100% { transform: translateX(0); } }
        @keyframes lungeLeft { 0% { transform: translateX(0); } 50% { transform: translateX(-30px); } 100% { transform: translateX(0); } }

        .battle-log-container {
            background: #222;
            border: 4px solid #fff;
            color: #0f0;
            height: 120px;
            overflow-y: auto;
            padding: 10px;
            font-size: 0.8rem;
            box-shadow: inset 0 0 10px #000;
            font-family: monospace;
        }

        /* --- Gacha Effects --- */
        .gacha-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .gacha-ray-container {
            position: absolute;
            width: 100%; height: 100%;
            overflow: hidden;
            display: none;
        }
        .ray {
            position: absolute;
            top: 50%; left: 50%;
            width: 200%; height: 20px;
            background: rgba(255,255,255,0.1);
            transform-origin: 0% 50%;
        }
        .ssr-glow {
            animation: rainbow 0.5s linear infinite, shake 0.5s infinite;
        }
        @keyframes rainbow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .gacha-result-text {
            color: white;
            font-size: 3rem;
            text-shadow: 0 0 20px gold;
            opacity: 0;
            transform: scale(0);
        }
        .show-result { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 100% { opacity: 1; transform: scale(1); } }

        /* --- Navigation --- */
        .nav-bar {
            position: fixed;
            bottom: 10px; left: 10px; right: 10px;
            background: var(--panel-bg);
            border: 4px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 500;
        }
        .nav-item {
            text-align: center;
            font-size: 0.8rem;
            color: #888;
            cursor: pointer;
            width: 25%;
        }
        .nav-icon { font-size: 1.8rem; display: block; }
        .nav-item.active { color: var(--primary); font-weight: bold; transform: translateY(-2px); }

        /* --- Screens --- */
        .screen { display: none; animation: slideUp 0.3s ease-out; }
        .screen.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

<div class="container">
    <!-- Home Screen -->
    <div id="screen-home" class="screen active">
        <div class="pixel-box header">
            <div class="level-tag">Lv.<span id="char-level">1</span></div>
            <div>今日の歩数</div>
            <div class="step-count"><span id="today-steps">0</span></div>
            <div style="font-size:0.8rem; color:#666;">NEXT: <span id="next-level-steps">1000</span>歩</div>
        </div>

        <button id="sensor-btn" class="btn-pixel" style="width:100%; margin-bottom:15px; background: #9575cd;" onclick="toggleSensor()">
            📱 計測モード開始
        </button>

        <div class="pixel-box" style="text-align:center; background: #fffbe6;">
            <div style="font-size:0.9rem; margin-bottom:10px; color:#555;">花ちゃん (あなた)</div>
            <div class="sprite-container">
                <div id="char-sprite" class="sprite hero-idle"></div>
            </div>
            <div style="margin-top:10px; font-size:0.8rem; color:#888;">
                ※歩くとアニメーションします
            </div>
        </div>

        <div class="pixel-box">
            <h3 style="margin:0 0 10px 0; border-bottom:2px dashed #ddd;">ステータス</h3>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div>HP: <strong id="stat-hp">100</strong></div>
                <div>MP: <strong id="stat-mp">10</strong></div>
                <div>攻: <strong id="stat-atk">10</strong></div>
                <div>防: <strong id="stat-def">10</strong></div>
            </div>
        </div>

        <div class="pixel-box">
            <h4 style="margin:0 0 5px 0;">📝 手動入力</h4>
            <div style="display:flex; gap:5px;">
                <input type="number" id="manual-steps" placeholder="歩数" style="flex:1; padding:8px; border:2px solid #ccc; font-family:var(--font-pixel);">
                <button class="btn-pixel" style="padding:5px 15px; font-size:1rem;" onclick="addStepsManual()">OK</button>
            </div>
        </div>
    </div>

    <!-- Battle Screen -->
    <div id="screen-battle" class="screen">
        <div class="pixel-box" style="background:#fffbe6;">
            <h2 style="margin:0;">⚔️ クエスト選択</h2>
            <div id="stage-container" style="margin-top:10px;">
                <!-- JS Generated -->
            </div>
        </div>
        
        <div id="battle-scene" style="display:none;">
            <div class="battle-stage" id="battle-stage">
                <div style="text-align:center;">
                    <div class="sprite-container">
                        <div id="battle-hero" class="sprite hero-idle"></div>
                    </div>
                    <div style="background:rgba(0,0,0,0.5); color:white; padding:2px; font-size:0.8rem; border-radius:4px;">YOU</div>
                </div>
                <div style="text-align:center;">
                    <div class="sprite-container">
                        <div id="battle-enemy" class="sprite enemy-slime"></div>
                    </div>
                    <div style="background:rgba(0,0,0,0.5); color:white; padding:2px; font-size:0.8rem; border-radius:4px;" id="enemy-name">敵</div>
                </div>
            </div>
            
            <div class="pixel-box battle-log-container" id="battle-log"></div>
            
            <button class="btn-pixel" onclick="closeBattle()" style="width:100%; background:#7f8c8d;">戻る</button>
        </div>
    </div>

    <!-- Gacha Screen -->
    <div id="screen-gacha" class="screen">
        <div class="pixel-box" style="text-align:center; background:#fff0f5;">
            <h2 style="color:#e91e63;">💎 召喚</h2>
            <div style="font-size:1.5rem; margin:15px 0;">
                所持石: <span id="stone-count" style="color:#2196f3; font-weight:bold;">0</span>
            </div>
            <p style="font-size:0.9rem;">5個で1回召喚できます</p>
            <button onclick="pullGacha()" class="btn-pixel" style="width:100%; font-size:1.5rem; padding:20px;">
                ガチャを回す！
            </button>
        </div>
        
        <div class="pixel-box">
            <h3>仲間一覧</h3>
            <ul id="inventory-list" style="padding-left:20px; margin:0;"></ul>
        </div>
    </div>

    <!-- History Screen -->
    <div id="screen-history" class="screen">
        <div class="pixel-box">
            <h2>📜 冒険の記録</h2>
            <p>累計歩数: <strong id="total-steps">0</strong> 歩</p>
            <p>到達ステージ: <strong id="cleared-stages">0</strong></p>
        </div>
    </div>
</div>

<!-- Gacha Animation Overlay -->
<div id="gacha-overlay" class="gacha-overlay" onclick="closeGachaResult()">
    <div id="gacha-rays" class="gacha-ray-container">
        <!-- Rays JS generated -->
    </div>
    <div id="gacha-result-text" class="gacha-result-text">
        SSR<br>伝説の勇者
    </div>
    <div style="margin-top:50px; color:white; font-size:0.8rem; opacity:0.8;">タップして閉じる</div>
</div>

<!-- Navigation -->
<div class="nav-bar">
    <div class="nav-item active" onclick="switchScreen('home', this)">
        <span class="nav-icon">🏠</span>ホーム
    </div>
    <div class="nav-item" onclick="switchScreen('battle', this)">
        <span class="nav-icon">⚔️</span>バトル
    </div>
    <div class="nav-item" onclick="switchScreen('gacha', this)">
        <span class="nav-icon">💎</span>ガチャ
    </div>
    <div class="nav-item" onclick="switchScreen('history', this)">
        <span class="nav-icon">📜</span>記録
    </div>
</div>

<script>
    // --- Game State ---
    let gameState = {
        totalSteps: 0,
        todaySteps: 0,
        level: 1,
        stones: 5,
        clearedStages: 0,
        inventory: [],
        lastLoginDate: new Date().toLocaleDateString()
    };

    // Load Data
    if(localStorage.getItem('hanaWalkData_v3')) {
        gameState = JSON.parse(localStorage.getItem('hanaWalkData_v3'));
        if(gameState.lastLoginDate !== new Date().toLocaleDateString()) {
            gameState.todaySteps = 0;
            gameState.lastLoginDate = new Date().toLocaleDateString();
            saveData();
        }
    }

    function saveData() {
        localStorage.setItem('hanaWalkData_v3', JSON.stringify(gameState));
        updateUI();
    }

    // --- Pedometer Logic ---
    let isSensing = false;
    let lastAcc = { x: 0, y: 0, z: 0 };
    let lastStepTime = 0;
    const ACC_THRESHOLD = 15;

    function toggleSensor() {
        const btn = document.getElementById('sensor-btn');
        if (isSensing) {
            window.removeEventListener('devicemotion', handleMotion);
            isSensing = false;
            btn.innerText = "📱 計測モード開始";
            btn.style.background = "#9575cd";
            document.getElementById('char-sprite').className = "sprite hero-idle";
            return;
        }
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            DeviceMotionEvent.requestPermission().then(r => {
                if(r==='granted') startSensing();
                else alert('許可されませんでした');
            });
        } else {
            startSensing();
        }
    }

    function startSensing() {
        window.addEventListener('devicemotion', handleMotion);
        isSensing = true;
        const btn = document.getElementById('sensor-btn');
        btn.innerText = "📡 計測中...";
        btn.style.background = "#ff4081";
    }

    function handleMotion(event) {
        const acc = event.accelerationIncludingGravity;
        if(!acc) return;
        const delta = Math.abs(acc.x - lastAcc.x) + Math.abs(acc.y - lastAcc.y) + Math.abs(acc.z - lastAcc.z);
        const now = Date.now();

        if (delta > ACC_THRESHOLD && (now - lastStepTime > 300)) {
            addSteps(1);
            lastStepTime = now;
            
            // Walk Animation
            const sprite = document.getElementById('char-sprite');
            if(!sprite.classList.contains('hero-walk')) {
                sprite.className = "sprite hero-walk";
                clearTimeout(window.walkTimer);
                window.walkTimer = setTimeout(() => {
                    if(isSensing) sprite.className = "sprite hero-idle";
                }, 1000);
            }
        }
        lastAcc = { x: acc.x, y: acc.y, z: acc.z };
    }

    function addSteps(n) {
        gameState.todaySteps += n;
        gameState.totalSteps += n;
        gameState.level = Math.floor(gameState.totalSteps / 1000) + 1;
        saveData();
    }
    
    function addStepsManual() {
        const v = parseInt(document.getElementById('manual-steps').value);
        if(v>0) { addSteps(v); document.getElementById('manual-steps').value=""; }
    }

    // --- Stats ---
    function getStats(lvl) {
        const m = Math.pow(1.2, lvl - 1);
        return {
            hp: Math.floor(100 * m),
            mp: Math.floor(10 * m),
            atk: Math.floor(10 * m),
            def: Math.floor(10 * m)
        };
    }

    function updateUI() {
        document.getElementById('today-steps').innerText = gameState.todaySteps;
        document.getElementById('total-steps').innerText = gameState.totalSteps;
        document.getElementById('char-level').innerText = gameState.level;
        document.getElementById('next-level-steps').innerText = 1000 - (gameState.totalSteps % 1000);
        document.getElementById('stone-count').innerText = gameState.stones;
        document.getElementById('cleared-stages').innerText = gameState.clearedStages;

        const s = getStats(gameState.level);
        document.getElementById('stat-hp').innerText = s.hp;
        document.getElementById('stat-mp').innerText = s.mp;
        document.getElementById('stat-atk').innerText = s.atk;
        document.getElementById('stat-def').innerText = s.def;

        renderInventory();
        renderStages();
    }

    // --- Battle System ---
    const enemies = [
        {name:"スライム", class:"enemy-slime", hp:50, atk:5},
        {name:"ゴブリン", class:"enemy-goblin", hp:150, atk:15},
        {name:"キング", class:"enemy-king", hp:1000, atk:50},
        {name:"ドラゴン", class:"enemy-dragon", hp:50000, atk:500}
    ];

    function renderStages() {
        const c = document.getElementById('stage-container');
        c.innerHTML = "";
        for(let i=1; i<=gameState.clearedStages+1; i++) {
            let e = enemies[(i-1)%4];
            let div = document.createElement('div');
            div.className = 'pixel-box';
            div.style.marginBottom = "5px";
            div.style.cursor = "pointer";
            div.innerHTML = `<strong>Stage ${i}</strong> (推奨Lv${i})<br>Boss: ${e.name}`;
            if(i<=gameState.clearedStages) div.style.background="#dcedc8"; // clear
            div.onclick = () => startBattle(i);
            c.appendChild(div);
        }
    }

    function startBattle(stage) {
        document.getElementById('stage-container').style.display = 'none';
        document.getElementById('battle-scene').style.display = 'block';
        
        const log = document.getElementById('battle-log');
        log.innerHTML = "=== BATTLE START ===<br>";
        
        const eData = enemies[(stage-1)%4];
        const growth = Math.pow(1.2, stage-1);
        
        let enemy = {
            name: eData.name,
            maxHp: Math.floor(eData.hp * growth),
            hp: Math.floor(eData.hp * growth),
            atk: Math.floor(eData.atk * growth),
            class: eData.class
        };
        
        let player = getStats(gameState.level);
        let playerHp = player.hp;
        
        // Setup Sprites
        document.getElementById('battle-hero').className = "sprite hero-idle";
        document.getElementById('battle-enemy').className = "sprite " + enemy.class;
        document.getElementById('enemy-name').innerText = enemy.name;

        // Loop
        let turn = 0;
        const timer = setInterval(() => {
            turn++;
            
            // Player Attack
            document.getElementById('battle-hero').className = "sprite hero-attack attack-anim-right";
            setTimeout(()=> document.getElementById('battle-hero').className="sprite hero-idle", 300);

            let dmg = Math.floor(player.atk * (0.9 + Math.random()*0.2));
            enemy.hp -= dmg;
            showDamage(document.getElementById('battle-enemy'), dmg, 'damage-enemy');
            
            // Enemy Shake
            const eSprite = document.getElementById('battle-enemy');
            eSprite.classList.add('shake');
            setTimeout(()=>eSprite.classList.remove('shake'), 300);

            log.innerHTML = `> あなたの攻撃! ${dmg}ダメ<br>` + log.innerHTML;

            if(enemy.hp <= 0) {
                clearInterval(timer);
                winBattle(stage);
                return;
            }

            // Enemy Attack (Delayed)
            setTimeout(() => {
                let eDmg = Math.max(1, Math.floor(enemy.atk - player.def/3));
                playerHp -= eDmg;
                
                showDamage(document.getElementById('battle-hero'), eDmg, 'damage-player');
                document.getElementById('battle-stage').classList.add('shake');
                setTimeout(()=>document.getElementById('battle-stage').classList.remove('shake'), 300);

                log.innerHTML = `<span style="color:#ff6f69">> ${enemy.name}の攻撃! ${eDmg}ダメ</span><br>` + log.innerHTML;
                
                if(playerHp <= 0) {
                    clearInterval(timer);
                    log.innerHTML = `<br><strong style="color:red">敗北...</strong><br>` + log.innerHTML;
                }
            }, 600);

        }, 1500);
    }

    function showDamage(target, val, typeClass) {
        const rect = target.getBoundingClientRect();
        const popup = document.createElement('div');
        popup.className = `damage-popup ${typeClass}`;
        popup.innerText = val;
        // Position relative to target
        popup.style.left = (rect.left + rect.width/2) + "px";
        popup.style.top = rect.top + "px";
        document.body.appendChild(popup);
        setTimeout(() => popup.remove(), 800);
    }

    function winBattle(stage) {
        const log = document.getElementById('battle-log');
        log.innerHTML = `<br><strong style="color:#f1c40f">勝利！！ 石 +1</strong><br>` + log.innerHTML;
        if(stage > gameState.clearedStages) gameState.clearedStages = stage;
        gameState.stones++;
        saveData();
    }

    function closeBattle() {
        document.getElementById('stage-container').style.display = 'block';
        document.getElementById('battle-scene').style.display = 'none';
        updateUI();
    }

    // --- Gacha System ---
    function pullGacha() {
        if(gameState.stones < 5) { alert("石が足りません"); return; }
        gameState.stones -= 5;
        
        // Logic
        const r = Math.random()*100;
        let rarity="N", name="村人", color="gray";
        
        if(r<8) { rarity="SSR"; name="伝説の勇者"; color="#e91e63"; }
        else if(r<20) { rarity="SR"; name="魔導師"; color="#f39c12"; }
        else if(r<40) { rarity="R"; name="戦士"; color="#3498db"; }
        
        gameState.inventory.push({rarity, name, date:new Date().toLocaleDateString()});
        saveData();

        // Animation
        playGachaAnim(rarity, name, color);
    }

    function playGachaAnim(rarity, name, color) {
        const overlay = document.getElementById('gacha-overlay');
        const rays = document.getElementById('gacha-rays');
        const text = document.getElementById('gacha-result-text');
        
        overlay.style.display = "flex";
        text.className = "gacha-result-text"; // reset
        text.innerHTML = "";
        rays.innerHTML = "";
        
        // Create Rays for high rarity
        if(rarity === "SSR" || rarity === "SR") {
            rays.style.display = "block";
            for(let i=0; i<12; i++) {
                let div = document.createElement('div');
                div.className = "ray";
                div.style.transform = `rotate(${i*30}deg)`;
                rays.appendChild(div);
            }
            if(rarity==="SSR") overlay.classList.add('ssr-glow');
        } else {
            rays.style.display = "none";
            overlay.classList.remove('ssr-glow');
        }

        // Delay for suspense
        setTimeout(() => {
            text.innerHTML = `<div style="font-size:1.5rem">${rarity}</div><div style="color:${color}">${name}</div>`;
            text.classList.add('show-result');
            
            // Vibration for SSR
            if(rarity==="SSR" && navigator.vibrate) navigator.vibrate([100,50,100,50,200]);
        }, 1500);
    }

    function closeGachaResult() {
        document.getElementById('gacha-overlay').style.display = "none";
        updateUI();
    }

    function renderInventory() {
        const l = document.getElementById('inventory-list');
        l.innerHTML = "";
        gameState.inventory.slice().reverse().forEach(i => {
            let li = document.createElement('li');
            li.style.borderBottom = "1px dashed #ccc";
            li.style.padding = "5px";
            li.style.listStyle = "none";
            li.innerHTML = `<strong class="rarity-${i.rarity}">${i.rarity}</strong> ${i.name}`;
            l.appendChild(li);
        });
    }

    // --- Nav ---
    function switchScreen(id, el) {
        document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
        document.getElementById('screen-'+id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
        el.classList.add('active');
    }

    // Init
    updateUI();
</script>

</body>
</html>
