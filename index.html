<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>花ちゃんウォーク</title>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff7e79;
            --accent: #ffd700;
            --bg-color: #2c3e50;
            --panel-bg: #fff;
            --text-color: #333;
            --font-pixel: 'DotGothic16', sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        body {
            font-family: var(--font-pixel);
            background-color: var(--bg-color);
            margin: 0; padding: 0 0 80px 0;
            color: var(--text-color);
            overflow: hidden;
        }

        .container {
            max-width: 600px; margin: 0 auto; height: 100vh;
            display: flex; flex-direction: column;
            background: #f0f8ff;
            position: relative;
        }

        .pixel-panel {
            background: var(--panel-bg);
            border: 4px solid #4a4a4a;
            border-radius: 8px;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
            padding: 15px;
            margin: 10px;
            position: relative;
            z-index: 10;
        }

        .btn {
            font-family: var(--font-pixel);
            background: var(--primary); color: white;
            border: 2px solid #4a4a4a;
            padding: 10px 0; width: 100%;
            font-size: 1.2rem; cursor: pointer;
            box-shadow: 0 4px 0 #c0392b;
            border-radius: 4px;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #c0392b; }

        .screen { flex: 1; overflow-y: auto; display: none; padding-bottom: 20px; }
        .screen.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

        /* --- Backgrounds --- */
        .home-scene {
            height: 300px; width: 100%; position: relative; overflow: hidden;
        }
        .parallax-bg {
            position: absolute; top:0; left:0; width:100%; height:100%; z-index: 0;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 100%);
        }
        .parallax-layer {
            position: absolute; bottom: 0; left: 0; width: 200%; height: 100%;
            background-repeat: repeat-x; animation: scroll linear infinite;
        }
        .layer-clouds {
            height: 100px; top: 20px; opacity: 0.6; animation-duration: 60s;
            background-image: radial-gradient(circle, #fff 50%, transparent 50%); background-size: 60px 60px;
        }
        .layer-mountains {
            height: 150px; bottom: 60px; animation-duration: 30s;
            background-image: linear-gradient(135deg, #5C6BC0 25%, transparent 25%), linear-gradient(225deg, #5C6BC0 25%, transparent 25%);
            background-size: 100px 100px;
        }
        .layer-trees-back {
            height: 80px; bottom: 50px; animation-duration: 15s;
            background: conic-gradient(from 150deg at 50% 30%, #388E3C 0deg 60deg, transparent 60deg 360deg);
            background-size: 40px 60px; background-position: bottom;
        }
        .layer-trees-front {
            height: 100px; bottom: 20px; animation-duration: 8s;
            background: conic-gradient(from 150deg at 50% 30%, #43A047 0deg 60deg, transparent 60deg 360deg);
            background-size: 60px 80px; background-position: bottom;
        }
        .layer-ground {
            height: 40px; bottom: 0; width: 100%; background: #8D6E63; border-top: 4px solid #5D4037; z-index: 5;
        }
        @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* --- New Image System --- */
        /* 個別画像を表示するためのクラス */
        .char-img {
            width: 100%; height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center bottom;
            image-rendering: pixelated; /* ドット絵をくっきり表示 */
            transition: transform 0.1s;
        }

        /* アニメーション定義 */
        .anim-walk { animation: bounce 0.5s infinite alternate; }
        .anim-attack { animation: lunge 0.3s; }
        .anim-damage { animation: shake 0.4s; filter: brightness(2) sepia(1) hue-rotate(-50deg) saturate(5); } /* 赤く点滅 */

        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }
        @keyframes lunge { 0% { transform: translateX(0); } 50% { transform: translateX(20px); } 100% { transform: translateX(0); } }
        @keyframes shake { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-5px); } 75% { transform:translateX(5px); } }

        /* キャラクターコンテナ */
        .char-main-container {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10;
            width: 120px; height: 120px;
        }

        /* バトル画面 */
        .battle-view {
            height: 250px; background: #222; position: relative; overflow: hidden;
            border-bottom: 4px solid #fff;
            background-image: linear-gradient(to bottom, #333, #000);
        }
        .battler-box {
            position: absolute; bottom: 40px; width: 100px; height: 100px; z-index: 5;
        }
        .battler-box.p { left: 15%; }
        .battler-box.e { right: 15%; }

        /* Damage Popup */
        .dmg-popup {
            position: absolute; color: white; font-size: 2.5rem; font-weight: bold;
            text-shadow: 2px 2px 0 #000; pointer-events: none; z-index: 100;
            animation: popUp 0.8s forwards; width: 100px; text-align: center;
        }
        .dmg-player { color: #ffeb3b; font-size: 3rem; }
        .dmg-enemy { color: #ff7e79; }
        @keyframes popUp {
            0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
            20% { transform: translate(0, -40px) scale(1.2); opacity: 1; }
            100% { transform: translate(0, -80px) scale(1); opacity: 0; }
        }

        /* Gacha */
        .gacha-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 2000;
            display: none; justify-content: center; align-items: center; flex-direction: column;
        }
        .stone-gem {
            font-size: 5rem; cursor: pointer; filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));
            animation: float 2s infinite ease-in-out;
        }
        @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-20px); } }
        
        .gacha-glow {
            position: absolute; width: 300px; height: 300px; border-radius: 50%; opacity: 0; transition: opacity 0.5s;
        }
        .glow-ssr { background: radial-gradient(circle, rgba(255,215,0,0.5), transparent); animation: spin 2s infinite linear; }
        .glow-sr { background: radial-gradient(circle, rgba(192,192,192,0.5), transparent); }
        .glow-n { background: radial-gradient(circle, rgba(135,206,235,0.5), transparent); }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .char-reveal {
            transform: scale(0); opacity: 0; transition: 0.5s; text-align: center; color: white;
        }
        .char-reveal.show { transform: scale(1); opacity: 1; }

        /* Nav */
        .nav-bar {
            position: fixed; bottom: 0; width: 100%; height: 70px;
            background: #fff; border-top: 4px solid #4a4a4a;
            display: flex; justify-content: space-around; align-items: center; z-index: 1000;
        }
        .nav-item { text-align: center; color: #999; font-size: 0.7rem; width: 20%; cursor: pointer; }
        .nav-item.active { color: var(--primary); font-weight: bold; transform: translateY(-2px); }
        .nav-icon { font-size: 1.5rem; display: block; margin-bottom: 2px; }

    </style>
</head>
<body>

<div class="container" id="app-container">

    <!-- HOME -->
    <div id="screen-home" class="screen active">
        <div class="home-scene">
            <div class="parallax-bg">
                <div class="parallax-layer layer-clouds"></div>
                <div class="parallax-layer layer-mountains"></div>
                <div class="parallax-layer layer-trees-back"></div>
                <div class="parallax-layer layer-trees-front"></div>
                <div class="parallax-layer layer-ground"></div>
            </div>
            
            <div class="char-main-container">
                <div style="background:rgba(0,0,0,0.6); color:white; padding:2px 8px; border-radius:10px; font-size:0.8rem; text-align:center; margin-bottom:5px;">
                    Lv.<span id="disp-lvl">1</span> <span id="disp-name">花ちゃん</span>
                </div>
                <!-- ホーム画面では歩く画像(hana2)を使用 -->
                <div id="home-char" class="char-img anim-walk"></div>
            </div>
        </div>

        <div class="pixel-panel" style="text-align:center; margin-top:-20px;">
            <div style="font-size:0.9rem; color:#888;">今日の歩数</div>
            <div style="font-size:3rem; color:#e74c3c; line-height:1;"><span id="disp-steps">0</span></div>
            <div style="font-size:0.8rem; margin-top:5px;">
                次のレベルまで: <strong id="disp-next">100</strong>歩
            </div>
            
            <div style="display:flex; gap:10px; margin-top:15px;">
                <input type="number" id="inp-steps" placeholder="歩数入力" style="flex:1; padding:10px; border:2px solid #ccc; font-family:inherit;">
                <button class="btn" style="width:auto; background:#2ecc71;" onclick="addSteps()">登録</button>
            </div>
        </div>

        <div class="pixel-panel">
            <h3 style="margin:0 0 10px 0; border-bottom:2px dashed #ccc;">ステータス</h3>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; font-size:1.1rem;">
                <div>HP: <strong id="st-hp">100</strong></div>
                <div>MP: <strong id="st-mp">10</strong></div>
                <div>攻: <strong id="st-atk">10</strong></div>
                <div>防: <strong id="st-def">10</strong></div>
            </div>
        </div>
        
        <div style="padding:0 10px;">
            <button class="btn" style="background:#3498db;" onclick="openCharSelect()">キャラ変更</button>
        </div>
    </div>

    <!-- BATTLE -->
    <div id="screen-battle" class="screen">
        <div class="pixel-panel">
            <h2>⚔️ クエスト</h2>
            <div id="stage-list"></div>
        </div>
        
        <div id="battle-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#222; z-index:1500; overflow-y:auto;">
            <div class="battle-view" id="battle-stage">
                <!-- Player -->
                <div class="battler-box p">
                    <div id="btl-p" class="char-img"></div>
                </div>
                <!-- Enemy -->
                <div class="battler-box e">
                    <div id="btl-e" class="char-img"></div>
                </div>
            </div>
            
            <div style="padding:15px; color:#fff;">
                <div id="battle-log" style="height:150px; overflow-y:auto; font-family:monospace; border:2px solid #666; padding:10px; background:rgba(0,0,0,0.5); font-size:0.9rem;"></div>
                <button class="btn" style="margin-top:20px; background:#95a5a6;" onclick="closeBattle()">逃げる / 戻る</button>
            </div>
        </div>
    </div>

    <!-- GACHA -->
    <div id="screen-gacha" class="screen">
        <div class="pixel-panel" style="text-align:center; background:#fff0f5;">
            <h2 style="color:#e91e63;">💎 召喚</h2>
            <div style="font-size:1.5rem; margin-bottom:15px;">
                石: <strong id="stone-cnt" style="color:#3498db;">0</strong>
            </div>
            <button class="btn" onclick="startGacha()">5個で召喚！</button>
        </div>

        <div class="pixel-panel">
            <h3>仲間リスト</h3>
            <div id="char-list"></div>
        </div>
    </div>

    <!-- HISTORY -->
    <div id="screen-history" class="screen">
        <div class="pixel-panel">
            <h2>📜 記録</h2>
            <p>累計歩数: <strong id="hist-total">0</strong></p>
            <p>クリア済: <strong id="hist-stage">0</strong></p>
        </div>
    </div>

</div>

<!-- NAV BAR -->
<div class="nav-bar">
    <div class="nav-item active" onclick="nav('home',this)"><span class="nav-icon">🏠</span>ホーム</div>
    <div class="nav-item" onclick="nav('battle',this)"><span class="nav-icon">⚔️</span>バトル</div>
    <div class="nav-item" onclick="nav('gacha',this)"><span class="nav-icon">💎</span>ガチャ</div>
    <div class="nav-item" onclick="alert('画像をファイルとして配置してください：hana1.jpg, hana2.jpg, hana3.jpg, enemy1.jpg〜enemy4.jpg')"><span class="nav-icon">ℹ️</span>info</div>
</div>

<!-- Gacha Overlay -->
<div id="gacha-ui" class="gacha-overlay">
    <div id="gacha-glow" class="gacha-glow"></div>
    <div id="gacha-stone" class="stone-gem" onclick="openStone()">💎</div>
    <div style="color:white; margin-top:20px; animation:blink 1s infinite;">TAP!</div>
    
    <div id="gacha-reveal" class="char-reveal">
        <div style="width:120px; height:120px; border:4px solid white; border-radius:10px; background-color:#fff; margin:0 auto;">
            <div id="new-char-img" class="char-img"></div>
        </div>
        <h2 id="new-char-name" style="margin:10px 0; font-size:2rem; text-shadow:0 0 10px gold;">???</h2>
        <div id="new-char-rare" style="font-size:1.5rem;">SSR</div>
        <button class="btn" style="margin-top:20px; width:200px;" onclick="closeGacha()">OK</button>
    </div>
</div>

<!-- Char Select Modal -->
<div id="char-modal" class="gacha-overlay" style="justify-content:flex-start; padding-top:50px;">
    <div class="pixel-panel" style="width:90%; max-height:80%; overflow-y:auto;">
        <h3>キャラクター変更</h3>
        <div id="select-list"></div>
        <button class="btn" style="margin-top:20px; background:#7f8c8d;" onclick="document.getElementById('char-modal').style.display='none'">閉じる</button>
    </div>
</div>

<script>
    // --- Data Definition ---
    // 画像パス定義: index.html と同じ階層にある画像を参照
    // hueFilter: 画像がないガチャキャラ用の色変えフィルタ
    const CHARS = {
        hana: { name: "花ちゃん", rarity: "N",  imgIdle:"hana1.jpg", imgWalk:"hana2.jpg", imgAtk:"hana3.jpg", stats: {hp:100, atk:10, def:10}, hueFilter: "" },
        hero: { name: "伝説の勇者", rarity: "SSR", imgIdle:"hana1.jpg", imgWalk:"hana2.jpg", imgAtk:"hana3.jpg", stats: {hp:150, atk:25, def:15}, hueFilter: "hue-rotate(45deg)" },
        mage: { name: "魔導師", rarity: "SR",  imgIdle:"hana1.jpg", imgWalk:"hana2.jpg", imgAtk:"hana3.jpg", stats: {hp:90, atk:35, def:8}, hueFilter: "hue-rotate(180deg)" },
        warrior: { name: "重戦士", rarity: "R",   imgIdle:"hana1.jpg", imgWalk:"hana2.jpg", imgAtk:"hana3.jpg", stats: {hp:130, atk:15, def:20}, hueFilter: "grayscale(100%)" },
        villager: { name: "村人A", rarity: "N",   imgIdle:"hana1.jpg", imgWalk:"hana2.jpg", imgAtk:"hana3.jpg", stats: {hp:80, atk:8, def:8}, hueFilter: "sepia(100%)" }
    };

    const ENEMIES = [
        { name: "スライム", img: "enemy1.jpg", hp:40, atk:5 },
        { name: "ゴブリン", img: "enemy2.jpg", hp:80, atk:12 },
        { name: "キング",   img: "enemy3.jpg", hp:400, atk:30 },
        { name: "ドラゴン", img: "enemy4.jpg", hp:3000, atk:150 }
    ];

    // --- State ---
    let state = {
        total: 0,
        stones: 5,
        cleared: 0,
        roster: [{ id: Date.now(), type: 'hana', lv: 1, exp: 0 }],
        activeId: null
    };

    function init() {
        const saved = localStorage.getItem('hw_v7');
        if(saved) state = JSON.parse(saved);
        if(!state.activeId && state.roster.length>0) state.activeId = state.roster[0].id;
        updateUI();
    }
    
    function save() {
        localStorage.setItem('hw_v7', JSON.stringify(state));
        updateUI();
    }

    function getActiveChar() {
        return state.roster.find(c => c.id === state.activeId) || state.roster[0];
    }

    function getStats(charData) {
        const tmpl = CHARS[charData.type];
        let mult = Math.pow(1.1, Math.min(9, charData.lv - 1));
        if(charData.lv > 10) mult *= Math.pow(1.01, charData.lv - 10);
        
        return {
            hp: Math.floor(tmpl.stats.hp * mult),
            atk: Math.floor(tmpl.stats.atk * mult),
            def: Math.floor(tmpl.stats.def * mult)
        };
    }

    function getNextExp(lv) {
        if(lv < 10) return lv * 100;
        return Math.floor(1000 * Math.pow(1.01, lv - 10));
    }

    function addSteps() {
        const v = parseInt(document.getElementById('inp-steps').value);
        if(!v || v<=0) return;
        document.getElementById('inp-steps').value = "";
        state.total += v;
        const char = getActiveChar();
        char.exp += v;
        while(true) {
            const req = getNextExp(char.lv);
            if(char.exp >= req) { char.exp -= req; char.lv++; alert(`Level Up! Lv.${char.lv}`); } else break;
        }
        save();
    }

    function updateUI() {
        const char = getActiveChar();
        const tmpl = CHARS[char.type];
        const stats = getStats(char);
        const req = getNextExp(char.lv);

        document.getElementById('disp-lvl').innerText = char.lv;
        document.getElementById('disp-name').innerText = tmpl.name;
        document.getElementById('disp-steps').innerText = state.total;
        document.getElementById('disp-next').innerText = req - char.exp;
        
        document.getElementById('st-hp').innerText = stats.hp;
        document.getElementById('st-mp').innerText = Math.floor(stats.hp/10);
        document.getElementById('st-atk').innerText = stats.atk;
        document.getElementById('st-def').innerText = stats.def;
        
        // ホーム画面の画像設定
        const homeChar = document.getElementById('home-char');
        homeChar.style.backgroundImage = `url('${tmpl.imgWalk}')`;
        homeChar.style.filter = tmpl.hueFilter;
        
        document.getElementById('stone-cnt').innerText = state.stones;
        document.getElementById('hist-total').innerText = state.total;
        document.getElementById('hist-stage').innerText = state.cleared;

        renderStageList();
        renderCharList();
    }

    // --- Battle ---
    function renderStageList() {
        const list = document.getElementById('stage-list');
        list.innerHTML = "";
        for(let i=1; i<=state.cleared+1; i++) {
            const eTmpl = ENEMIES[(i-1)%4];
            const div = document.createElement('div');
            div.className = "pixel-panel";
            div.style.padding = "10px";
            div.style.cursor = "pointer";
            div.innerHTML = `<strong>Stage ${i}</strong> (Boss: ${eTmpl.name})`;
            div.onclick = () => startBattle(i);
            list.appendChild(div);
        }
    }

    function startBattle(stg) {
        document.getElementById('battle-overlay').style.display = 'block';
        const log = document.getElementById('battle-log');
        log.innerHTML = `--- Stage ${stg} Start ---<br>`;
        
        const char = getActiveChar();
        const cStats = getStats(char);
        const cTmpl = CHARS[char.type];
        const eTmpl = ENEMIES[(stg-1)%4];
        
        const grow = Math.pow(1.15, stg-1);
        let enemy = { hp: Math.floor(eTmpl.hp * grow), atk: Math.floor(eTmpl.atk * grow) };

        // 画像セット
        const pEl = document.getElementById('btl-p');
        const eEl = document.getElementById('btl-e');
        
        pEl.style.backgroundImage = `url('${cTmpl.imgIdle}')`;
        pEl.style.filter = cTmpl.hueFilter;
        eEl.style.backgroundImage = `url('${eTmpl.img}')`;
        
        let pHp = cStats.hp;
        
        window.btlTimer = setInterval(() => {
            // Player Attack
            const dmg = Math.max(1, Math.floor(cStats.atk * (0.9 + Math.random()*0.2)));
            enemy.hp -= dmg;
            
            // Anim: Attack image swap
            pEl.style.backgroundImage = `url('${cTmpl.imgAtk}')`;
            pEl.classList.add('anim-attack');
            setTimeout(()=> {
                pEl.style.backgroundImage = `url('${cTmpl.imgIdle}')`;
                pEl.classList.remove('anim-attack');
            }, 300);
            
            showDmg(document.querySelector('.battler-box.e'), dmg, 'dmg-player');
            // 敵にダメージ演出
            eEl.classList.add('anim-damage');
            setTimeout(()=>eEl.classList.remove('anim-damage'), 400);

            log.innerHTML = `<span style="color:#4caf50">あなた: ${dmg}</span> (敵:${Math.max(0,enemy.hp)})<br>` + log.innerHTML;
            
            if(enemy.hp <= 0) { clearInterval(window.btlTimer); win(stg); return; }

            // Enemy Turn
            setTimeout(() => {
                const eDmg = Math.max(1, Math.floor(enemy.atk - cStats.def/2));
                pHp -= eDmg;
                
                showDmg(document.querySelector('.battler-box.p'), eDmg, 'dmg-enemy');
                
                // 味方ダメージ演出
                pEl.classList.add('anim-damage');
                setTimeout(()=>pEl.classList.remove('anim-damage'), 400);

                log.innerHTML = `<span style="color:#e74c3c">敵: ${eDmg}</span> (残:${Math.max(0,pHp)})<br>` + log.innerHTML;
                
                if(pHp <= 0) {
                    clearInterval(window.btlTimer);
                    log.innerHTML = `<strong style="color:red">敗北...</strong><br>` + log.innerHTML;
                }
            }, 600);
        }, 1500);
    }

    function showDmg(targetBox, val, typeClass) {
        if(!targetBox) return;
        const rect = targetBox.getBoundingClientRect();
        const el = document.createElement('div');
        el.className = `dmg-popup ${typeClass}`;
        el.innerText = val;
        el.style.left = (rect.left + rect.width/2 - 50) + "px";
        el.style.top = rect.top + "px";
        document.body.appendChild(el);
        setTimeout(()=>el.remove(), 800);
    }

    function win(stg) {
        const log = document.getElementById('battle-log');
        const getStones = Math.floor(Math.random()*3)+1;
        log.innerHTML = `<strong style="color:gold">勝利！ 石+${getStones}</strong><br>` + log.innerHTML;
        if(stg > state.cleared) state.cleared = stg;
        state.stones += getStones;
        save();
    }

    function closeBattle() {
        clearInterval(window.btlTimer);
        document.getElementById('battle-overlay').style.display = 'none';
        updateUI();
    }

    // --- Gacha ---
    let pendingGachaResult = null;
    function startGacha() {
        if(state.stones < 5) { alert("石が足りません"); return; }
        state.stones -= 5;
        save();
        
        document.getElementById('gacha-ui').style.display = 'flex';
        document.getElementById('gacha-stone').style.display = 'block';
        document.getElementById('gacha-reveal').classList.remove('show');
        document.getElementById('gacha-glow').className = 'gacha-glow';
        
        const r = Math.random()*100;
        let type = 'villager';
        if(r < 8) type = 'hero';
        else if(r < 20) type = 'mage';
        else if(r < 40) type = 'warrior';
        pendingGachaResult = type;
    }

    function openStone() {
        const type = pendingGachaResult;
        const rarity = CHARS[type].rarity;
        
        const glow = document.getElementById('gacha-glow');
        glow.style.opacity = 1;
        if(rarity === 'SSR') glow.classList.add('glow-ssr');
        else if(rarity === 'SR') glow.classList.add('glow-sr');
        else glow.classList.add('glow-n');
        
        const stone = document.getElementById('gacha-stone');
        stone.style.animation = "shake 0.5s infinite"; // 揺らす

        setTimeout(() => {
            stone.style.display = 'none';
            showResult(type);
        }, 1500);
    }

    function showResult(type) {
        const tmpl = CHARS[type];
        const rev = document.getElementById('gacha-reveal');
        
        document.getElementById('new-char-name').innerText = tmpl.name;
        document.getElementById('new-char-rare').innerText = tmpl.rarity;
        document.getElementById('new-char-rare').style.color = (tmpl.rarity==='SSR' ? 'gold' : 'white');
        
        const img = document.getElementById('new-char-img');
        img.style.backgroundImage = `url('${tmpl.imgWalk}')`;
        img.style.filter = tmpl.hueFilter;
        
        rev.classList.add('show');
        state.roster.push({ id: Date.now(), type: type, lv: 1, exp: 0 });
        save();
    }

    function closeGacha() {
        document.getElementById('gacha-ui').style.display = 'none';
        updateUI();
    }

    function renderCharList() {
        const div = document.getElementById('char-list');
        div.innerHTML = "";
        state.roster.slice().reverse().forEach(c => {
            const tmpl = CHARS[c.type];
            const d = document.createElement('div');
            d.style.borderBottom = "1px solid #ddd"; d.style.padding="5px";
            d.innerHTML = `[${tmpl.rarity}] ${tmpl.name} (Lv.${c.lv})`;
            div.appendChild(d);
        });
    }

    function openCharSelect() {
        document.getElementById('char-modal').style.display = 'flex';
        const div = document.getElementById('select-list');
        div.innerHTML = "";
        state.roster.forEach(c => {
            const tmpl = CHARS[c.type];
            const btn = document.createElement('div');
            btn.className = "btn";
            btn.style.marginTop = "10px";
            btn.style.background = (c.id === state.activeId) ? "#2ecc71" : "#fff";
            btn.style.color = (c.id === state.activeId) ? "#fff" : "#333";
            btn.innerHTML = `${tmpl.name} (Lv.${c.lv})`;
            btn.onclick = () => { state.activeId = c.id; save(); document.getElementById('char-modal').style.display = 'none'; };
            div.appendChild(btn);
        });
    }

    function nav(id, el) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-'+id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        if(el) el.classList.add('active');
    }

    init();
</script>
</body>
</html>
